name: Build Android APK & iOS Framework

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    if: false
    name: Build Android APK & Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: GMI-Mentorship-Portal-Android-APK
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk

  build-ios:
    name: Build iOS Framework (macOS Cloud Runner with Xcode)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compile & Link iOS Simulator Framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

      - name: Compile & Link iOS Device Framework (Arm64)
        run: ./gradlew :composeApp:linkDebugFrameworkIosArm64

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd iosApp
          xcodegen generate
          cd ..

      - name: Build iOS Simulator App (for Appetize.io)
        run: |
          set -e
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
          
          mkdir -p build-appetize
          cp -R build-sim/Build/Products/Debug-iphonesimulator/iosApp.app build-appetize/GMIPortal.app
          cd build-appetize
          zip -r "$GITHUB_WORKSPACE/GMIPortal-Simulator.zip" GMIPortal.app
          cd "$GITHUB_WORKSPACE"

      - name: Build iOS Device IPA (for Sideloadly)
        run: |
          set -e
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-dev \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
          
          mkdir -p Payload
          cp -R build-dev/Build/Products/Debug-iphoneos/iosApp.app Payload/GMIPortal.app
          zip -r "$GITHUB_WORKSPACE/GMIPortal.ipa" Payload

      - name: Upload Appetize Simulator Zip
        uses: actions/upload-artifact@v4
        with:
          name: GMI-Mentorship-Portal-iOS-Appetize-Simulator
          path: GMIPortal-Simulator.zip

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GMI-Mentorship-Portal-iOS-IPA
          path: GMIPortal.ipa

      - name: Upload iOS Framework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GMI-Mentorship-Portal-iOS-Framework
          path: composeApp/build/bin/
