name: Build Android APK & iOS Framework

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: GMI-Mentorship-Portal-Android-APK
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk

  build-ios:
    name: Build iOS Framework (macOS Cloud Runner with Xcode)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compile & Link iOS Simulator Framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

      - name: Build iOS App Archive (Optional IPA / Framework)
        run: ./gradlew :composeApp:assembleComposeAppDebugFrameworkIosArm64

      - name: Upload iOS Framework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GMI-Mentorship-Portal-iOS-Framework
          path: composeApp/build/bin/
