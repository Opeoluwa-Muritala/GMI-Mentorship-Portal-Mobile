name: Build Android APK & iOS Framework

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: GMI-Mentorship-Portal-Android-APK
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk

  build-ios:
    name: Build iOS Framework (macOS Cloud Runner with Xcode)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compile & Link iOS Simulator Framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

      - name: Compile & Link iOS Device Framework (Arm64)
        run: ./gradlew :composeApp:linkDebugFrameworkIosArm64

      - name: Package iOS Simulator App (for Appetize.io)
        run: |
          set -e
          SIM_SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          SIM_FW_DIR="$PWD/composeApp/build/bin/iosSimulatorArm64/debugFramework"
          APPETIZE_APP_DIR="$PWD/build-appetize/GMIPortal.app"
          
          mkdir -p "$APPETIZE_APP_DIR/Frameworks"
          
          xcrun -sdk iphonesimulator swiftc \
            -parse-as-library \
            iosApp/iosApp/iOSApp.swift iosApp/iosApp/ContentView.swift \
            -sdk "$SIM_SDK" \
            -target arm64-apple-ios15.0-simulator \
            -F "$SIM_FW_DIR" \
            -framework ComposeApp \
            -Xlinker -rpath -Xlinker @executable_path/Frameworks \
            -o "$APPETIZE_APP_DIR/GMIPortal"
          
          cp iosApp/Info.plist "$APPETIZE_APP_DIR/Info.plist"
          cp -R "$SIM_FW_DIR/ComposeApp.framework" "$APPETIZE_APP_DIR/Frameworks/"
          
          cd "$PWD/build-appetize"
          zip -r "$GITHUB_WORKSPACE/GMIPortal-Simulator.zip" GMIPortal.app
          cd "$GITHUB_WORKSPACE"

      - name: Package iOS IPA (for Sideloadly / Device)
        run: |
          set -e
          DEV_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          DEV_FW_DIR="$PWD/composeApp/build/bin/iosArm64/debugFramework"
          PAYLOAD_DIR="$PWD/build-ipa/Payload"
          APP_DIR="$PAYLOAD_DIR/GMIPortal.app"
          
          mkdir -p "$APP_DIR/Frameworks"
          
          xcrun -sdk iphoneos swiftc \
            -parse-as-library \
            iosApp/iosApp/iOSApp.swift iosApp/iosApp/ContentView.swift \
            -sdk "$DEV_SDK" \
            -target arm64-apple-ios15.0 \
            -F "$DEV_FW_DIR" \
            -framework ComposeApp \
            -Xlinker -rpath -Xlinker @executable_path/Frameworks \
            -o "$APP_DIR/GMIPortal"
          
          cp iosApp/Info.plist "$APP_DIR/Info.plist"
          cp -R "$DEV_FW_DIR/ComposeApp.framework" "$APP_DIR/Frameworks/"
          
          cd "$PWD/build-ipa"
          zip -r "$GITHUB_WORKSPACE/GMIPortal.ipa" Payload
          cd "$GITHUB_WORKSPACE"

      - name: Upload Appetize Simulator Zip
        uses: actions/upload-artifact@v4
        with:
          name: GMI-Mentorship-Portal-iOS-Appetize-Simulator
          path: GMIPortal-Simulator.zip

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GMI-Mentorship-Portal-iOS-IPA
          path: GMIPortal.ipa

      - name: Upload iOS Framework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GMI-Mentorship-Portal-iOS-Framework
          path: composeApp/build/bin/
